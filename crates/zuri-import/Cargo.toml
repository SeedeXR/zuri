[package]
name = "zuri-import"
description = "Authoring-time importers for Zuri: SVG, Lottie, OBJ, glTF/GLB and FBX to JSON source, and WGSL shader translation."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zuri-core = { workspace = true, features = ["json", "text"] }
serde_json = "1"
naga = { version = "30", default-features = false, features = ["wgsl-in", "glsl-out", "hlsl-out"] }
gltf = { version = "1.4", default-features = false, features = ["utils"] }
ufbx = "0.11"
usvg = { version = "0.50", default-features = false }
ttf-parser = { workspace = true }

[dev-dependencies]
# The font test draws text.
zuri-core = { workspace = true, features = ["text"] }

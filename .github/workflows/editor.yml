# Packages the desktop editor (Tauri) on the three systems Zuri has to work on, starts the
# packaged program to see that it comes up, and keeps the installers as build artifacts.
# It takes a while, so it does not run on every push: run it by hand (Actions > editor >
# Run workflow), push a `v*` tag, or push the branch `bundle` to try a change to it.
# Nothing is published: a release is the owner's decision.
name: editor
on:
  workflow_dispatch:
  push:
    branches: [bundle]
    tags: ['v*']

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # The same compiler as ci.yml.
      - run: rustup toolchain install 1.98 --profile minimal --target wasm32-unknown-unknown && rustup default 1.98
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Linux packages for the web view and the bundler
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf xvfb

      - run: pnpm install --frozen-lockfile
      # The editor embeds the runtime: build the wasm and its wrapper first.
      - run: pnpm --filter @seedexr/zuri build
      - run: pnpm --filter ./apps/editor tauri build

      - name: the packaged program starts and stays up
        run: |
          app=apps/editor/src-tauri/target/release/zuri-editor
          case "$RUNNER_OS" in
            Linux) xvfb-run -a "$app" & ;;
            Windows) "$app.exe" & ;;
            *) "$app" & ;;
          esac
          pid=$!
          sleep 20
          # Still running after 20 seconds: it did not die on a missing library or web view.
          kill -0 "$pid" || { echo "the editor exited on start"; exit 1; }
          kill "$pid" || true

      - uses: actions/upload-artifact@v4
        with:
          name: zuri-editor-${{ runner.os }}
          if-no-files-found: error
          path: |
            apps/editor/src-tauri/target/release/bundle/dmg/*.dmg
            apps/editor/src-tauri/target/release/bundle/deb/*.deb
            apps/editor/src-tauri/target/release/bundle/rpm/*.rpm
            apps/editor/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/editor/src-tauri/target/release/bundle/msi/*.msi
            apps/editor/src-tauri/target/release/bundle/nsis/*.exe

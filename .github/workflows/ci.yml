# The gate, on the three systems Zuri has to work on. Each job runs what a developer runs:
# scripts/verify.sh, then the pieces verify.sh leaves out because they need system packages
# (the Tauri editor shell) or are per-platform artifacts (the Unreal static library).
# Not here: the Unity and Unreal editors themselves (scripts/verify-engines.sh needs them installed).
name: ci
on: push

jobs:
  gate:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # One compiler version: rustfmt and clippy change between releases, and the gate
      # treats their output as errors. Keep it in step with what developers use.
      - run: rustup toolchain install 1.98 --profile minimal --component rustfmt,clippy --target wasm32-unknown-unknown && rustup default 1.98
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - run: bash scripts/verify.sh

      - name: Linux packages for the editor shell
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev
      - name: editor shell (Tauri) builds, links and its tests pass
        run: cargo build --manifest-path apps/editor/src-tauri/Cargo.toml && cargo test --manifest-path apps/editor/src-tauri/Cargo.toml

      - name: the other Apple target, for the universal library
        if: runner.os == 'macOS'
        run: rustup target add x86_64-apple-darwin
      - name: Unreal static library for this system
        run: bash scripts/build-unreal-libs.sh
      - name: Unity native plugin for this system
        run: bash scripts/build-unity-plugins.sh
